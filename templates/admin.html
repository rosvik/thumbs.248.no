<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="https://248.no/favicon.svg" />
    <title>admin - thumbs.248.no</title>
    <style>
      * {
        font-family: "Berkeley Mono", Menlo, monospace;
        font-size: 12px;
        color: white;
      }
      body {
        background-color: #0f1419;
        margin: auto;
        padding: 2em;
      }
      a {
        color: rgb(242, 151, 24);
        text-decoration: none;
      }
      /* Cards are appended, so cards already on the page keeps their horizontal
         position when new cards arrive. The grid is flipped, and each card
         flipped back, which anchors wrapping at the bottom right and puts the
         newest card top left. */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1em;
        transform: rotate(180deg);
      }
      .card {
        transform: rotate(180deg);
        border: 1px solid gray;
        background-color: #1f2931;
        padding: 0.5em;
      }
      .card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background-color: #0f1419;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5em;
        padding-top: 0.5em;
      }
      button {
        text-transform: uppercase;
        padding: 0.5em 1em;
        background-color: rgba(176, 35, 3, 0.3);
        border: 1px solid rgba(176, 35, 3, 0.5);
        outline: none;
      }
      button:hover {
        cursor: pointer;
        border-color: rgb(176, 35, 3);
        background-color: rgba(176, 35, 3, 0.5);
      }
      .flag {
        margin-right: auto;
        padding: 0.2em 0.5em;
        background-color: rgba(128, 128, 128, 0.2);
        color: rgb(128, 128, 128);
      }
      .new {
        color: rgb(125, 208, 125);
        background-color: rgba(125, 208, 125, 0.15);
        border-color: rgba(125, 208, 125, 0.5);
      }
      .error {
        color: #ff7a5c;
      }
      .muted {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h1>Loaded thumbnails</h1>
    <p id="status" class="muted">Connecting...</p>
    <div class="grid" id="grid"></div>

    <script>
      const base = window.location.pathname.replace(/\/$/, "");
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");

      // Only start fetching a thumbnail once its card is about to be visible
      const imageObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              observer.unobserve(img);
            }
          });
        },
        { rootMargin: "50px 0px", threshold: 0.1 }
      );

      // De-duplicates thumbnails already on the page. Without this, the
      // page would keep adding cards for its own requests.
      const seen = new Set();

      connect();

      function connect() {
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(
          `${scheme}://${window.location.host}/firehose`
        );

        socket.addEventListener("open", () => {
          status.textContent = "Waiting for thumbnails...";
          status.className = "muted";
        });

        socket.addEventListener("message", (event) => {
          // "CACHE {id}" for a cache hit, "NEW {id}" for a fresh fetch
          const [flag, id] = event.data.split(" ");
          if (!id || seen.has(id)) return;
          seen.add(id);
          grid.append(card(id, flag));
          status.textContent = `${seen.size} thumbnails`;
          status.className = "muted";
        });

        socket.addEventListener("close", () => {
          status.textContent = "Disconnected, reconnecting...";
          status.className = "error";
          setTimeout(connect, 2000);
        });
      }

      function card(id, flag) {
        const card = document.createElement("a");
        card.className = flag === "NEW" ? "card new" : "card";
        card.href = `https://www.youtube.com/watch?v=${id}`;
        card.target = "_blank";

        const img = document.createElement("img");
        img.dataset.src = `/${id}`;
        img.alt = id;
        card.appendChild(img);
        imageObserver.observe(img);

        const row = document.createElement("div");
        row.className = "row";

        const text = document.createElement("span");
        text.textContent = id;
        row.appendChild(text);

        const badge = document.createElement("span");
        badge.className = flag === "NEW" ? "flag new" : "flag cache";
        badge.textContent = flag;
        row.appendChild(badge);

        const button = document.createElement("button");
        button.textContent = "Delete";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          remove(id, card, button);
        });
        row.appendChild(button);

        card.appendChild(row);
        return card;
      }

      async function remove(id, card, button) {
        try {
          const response = await fetch(`${base}/thumbnail/${id}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          imageObserver.unobserve(card.querySelector("img"));
          card.remove();
          seen.delete(id);
          status.textContent = `${seen.size} thumbnails`;
        } catch (e) {
          alert(`Delete failed: ${e.message}`);
        }
      }
    </script>
  </body>
</html>
