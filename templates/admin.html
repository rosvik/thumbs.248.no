<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="https://248.no/favicon.svg" />
    <title>admin - thumbs.248.no</title>
    <style>
      * {
        font-family: "Berkeley Mono", Menlo, monospace;
        font-size: 12px;
        color: white;
      }
      body {
        background-color: #0f1419;
        margin: auto;
        padding: 2em;
      }
      a {
        color: rgb(242, 151, 24);
        text-decoration: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1em;
      }
      .card {
        border: 1px solid gray;
        background-color: #1f2931;
        padding: 0.5em;
      }
      .card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background-color: #0f1419;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5em;
        padding-top: 0.5em;
      }
      button {
        text-transform: uppercase;
        padding: 0.5em 1em;
        background-color: rgba(176, 35, 3, 0.3);
        border: 1px solid rgba(176, 35, 3, 0.5);
        outline: none;
      }
      button:hover {
        cursor: pointer;
        border-color: rgb(176, 35, 3);
        background-color: rgba(176, 35, 3, 0.5);
      }
      .error {
        color: #ff7a5c;
      }
      .muted {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h1>Recently loaded thumbnails</h1>
    <p id="status" class="muted">Loading...</p>
    <div class="grid" id="grid"></div>

    <script>
      const base = window.location.pathname.replace(/\/$/, "");
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");

      load();

      async function load() {
        let ids = [];
        try {
          const response = await fetch(`${base}/thumbnails`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          ids = text.split("\n").filter((id) => id.length > 0);
        } catch (e) {
          status.textContent = `Failed to load list: ${e.message}`;
          status.className = "error";
          return;
        }

        status.textContent = `${ids.length} thumbnails`;
        for (const id of ids) grid.appendChild(card(id));
      }

      function card(id) {
        const card = document.createElement("a");
        card.className = "card";
        card.href = `https://www.youtube.com/watch?v=${id}`;
        card.target = "_blank";

        const img = document.createElement("img");
        img.src = `/${id}`;
        img.loading = "lazy";
        img.alt = id;
        card.appendChild(img);

        const row = document.createElement("div");
        row.className = "row";

        const text = document.createElement("span");
        text.textContent = id;
        row.appendChild(text);

        const button = document.createElement("button");
        button.textContent = "Delete";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          remove(id, card, button);
        });
        row.appendChild(button);

        card.appendChild(row);
        return card;
      }

      async function remove(id, card, button) {
        try {
          const response = await fetch(`${base}/thumbnail/${id}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          card.remove();
        } catch (e) {
          alert(`Delete failed: ${e.message}`);
        }
      }
    </script>
  </body>
</html>
